plugins { id 'com.android.application' }
android {
    namespace 'com.convertisseur.apk'
    compileSdk 34
    defaultConfig {
        applicationId 'com.convertisseur.apk'
        minSdk 21
        targetSdk 34
        versionCode 1
        versionName '1.2'
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    lint { checkReleaseBuilds false; abortOnError false }
    signingConfigs { release { storeFile file('../release.jks'); storePassword 'android123'; keyAlias 'key'; keyPassword 'android123' } }
    buildTypes { release { signingConfig signingConfigs.release; minifyEnabled false } }
}
