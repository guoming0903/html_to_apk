name: Build Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch: # 支援手動觸發按鈕

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. 簽出程式碼
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. 設定 Node.js 環境
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      # 3. 安裝依賴、檢查並自動建立 Android 專案與同步
      - name: Install Dependencies and Sync Capacitor
        run: |
          npm install
          npm install @capacitor/local-notifications
          
          # 檢查如果沒有 android 資料夾，就自動補上，避免報錯
          if [ ! -d "android" ]; then
            echo "Android directory not found. Adding android platform..."
            npx cap add android
          fi
          
          npx cap sync

      # 4. 設定 Java (使用最新的 v5 版本避免警告)
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      # 5. 給予 gradlew 執行權限並執行 Android 編譯 (Debug APK)
      - name: Build APK with Gradle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      # 6. 上傳生成的 APK 檔案 (使用最新的 v4 版本)
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
