name: Build Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install Dependencies and Sync Capacitor
        run: |
          npm install
          npm install @capacitor/app @capacitor/local-notifications
          
          if [ ! -d "android" ]; then
            echo "Android directory not found. Adding android platform..."
            npx cap add android
          fi
          
          npx cap sync

      # ====== 💡 注意：我們移除了 sed 修改指令，直接讀取您完美的 AndroidManifest.xml ======

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Build APK with Gradle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
