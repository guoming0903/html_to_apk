name: Build Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. 簽出程式碼
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. 設定 Node.js 環境
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18' # 請依您的專案需求調整版本

      # 3. 安裝專案依賴、Local Notifications 外掛並同步 Capacitor
      - name: Install Dependencies and Sync Capacitor
        run: |
          npm install
          npm install @capacitor/local-notifications
          npx cap sync

      # 4. 設定 Java (Android 開發所需)
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # 5. 給予 gradlew 執行權限並執行 Android 編譯 (Build APK)
      - name: Build APK with Gradle
        run: |
          cd android # 若您的專案結構 android 資料夾在根目錄
          # 若您的專案結構是在根目錄直接有 gradlew，請調整路徑，例如 chmod +x gradlew && ./gradlew assembleDebug
          chmod +x gradlew
          ./gradlew assembleDebug

      # 6. 上傳生成的 APK 檔案作為 Artifact
      - name: Upload APK
        uses: actions/upload-artifact@v3
        with:
          name: app-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk # 依實際輸出路徑調整
